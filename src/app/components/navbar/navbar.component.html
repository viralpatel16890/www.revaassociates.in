<header class="header" [class.scrolled]="isScrolled()">
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-contacts">
        <a [href]="biz.phoneHref"><i icon="phone"></i> {{ biz.phoneDisplayIntl }}</a>
        <a [href]="biz.emailHref"><i icon="envelope"></i> {{ biz.email }}</a>
        <span><i icon="clock"></i> {{ biz.hours.display }}</span>
      </div>
      <div class="topbar-socials">
        <a [href]="biz.whatsappUrl" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><i icon="whatsapp"></i></a>
      </div>
    </div>
  </div>

  <nav class="navbar">
    <div class="container nav-container">
      <a routerLink="/" class="logo">
        <span class="logo-mark"><i icon="chart-line"></i></span>
        <div class="logo-text">
          <span class="logo-title">REVA ASSOCIATES</span>
          <span class="logo-tagline">Your Trusted Financial Partner</span>
        </div>
      </a>

      <button class="mobile-toggle" (click)="toggleMenu()" aria-label="Toggle navigation">
        <i [icon]="menuOpen() ? 'xmark' : 'bars'"></i>
      </button>

      <div class="nav-links" [class.open]="menuOpen()">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Us</a>
        <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a>
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
        <a routerLink="/contact" class="btn btn-primary nav-cta" (click)="closeMenu()">
          <span>Book Free Consultation</span>
          <i icon="arrow-right"></i>
        </a>
      </div>
    </div>
  </nav>
</header>
